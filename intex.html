<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="author" content="Agustina Hernandez" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Juego de Adivinar el Número</title>
  </head>
  <body>
    <div class="container text-center mt-5">
      <h1 class="mb-4">Adivina el Número Mágico</h1>

      <button id="comienzaElJuego" class="btn btn-primary mb-4">
        Comenzar el Juego
      </button>
      <button id="cambiarTema" class="btn btn-warning mb-4">Cambiar Tema</button>

      <div id="areaDeJuego" class="d-none">
        <input
          type="number"
          id="userInput"
          class="form-control mb-2"
          placeholder="Ingresa un número"
        />
        <button id="submitGuess" class="btn btn-success">Enviar</button>
      </div>
    </div>
    <script src="./js/add.js"></script>
  </body>
</html>
